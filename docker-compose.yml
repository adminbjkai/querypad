services:
  querypad:
    build: .
    image: querypad:latest
    container_name: querypad
    restart: unless-stopped
    env_file:
      - .env.server
    ports:
      - "127.0.0.1:8059:3000"
    volumes:
      # Spaces, tabs, history and table files, shared by every device.
      - querypad-data:/data
      # Socket of the host's local AI bridge (local-ai/bridge.mjs): signed-in AI CLIs, no API keys.
      - ${HOME}/.local/state/querypad-ai:/run/querypad-ai
    mem_limit: 384m

  # Real-time collaboration relay, proxied by nginx at /collab/.
  collab:
    image: querypad:latest
    container_name: querypad-collab
    restart: unless-stopped
    command: ["node", "collab/server.mjs"]
    environment:
      - PORT=1999
    ports:
      - "127.0.0.1:8061:1999"
    mem_limit: 192m
    depends_on:
      - querypad

volumes:
  querypad-data:
